<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0f2f4f">
<title>여행 가이드</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>

:root{
  --navy:#0f2f4f; --navy2:#1c4a73; --red:#c8402f; --gold:#e8a33d;
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d2329; --sub:#5d6670; --line:#e3ddd1;
  --ok:#2f8f5b; --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.55}
a{color:var(--navy2)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + var(--safe-b))}

/* ---------- header ---------- */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
  padding:calc(18px + var(--safe-t)) 18px 20px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,163,61,.35),transparent 70%)}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero h1{margin:6px 0 2px;font-size:23px;letter-spacing:-.3px}
.hero .meta{font-size:13.5px;opacity:.85}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:#7be3a3}
.pill.off::before{background:#ff9a8a}
.dday{font-weight:800;font-size:13px;background:var(--gold);color:#2a1a00;padding:4px 10px;border-radius:99px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 0;position:relative;z-index:1}
.qbtn{border:0;border-radius:16px;padding:12px 6px;background:#fff;color:var(--navy);font-weight:700;font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;font-family:inherit}
.qbtn .ic{font-size:24px;line-height:1}
.qbtn:active{transform:scale(.96)}
.qbtn.primary{background:var(--gold);color:#2a1a00}

/* ---------- sections ---------- */
main{padding:6px 14px}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:19px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec small{font-size:12px;color:var(--sub);font-weight:500}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(15,47,79,.06)}
.card h3{margin:0 0 6px;font-size:16.5px}
.muted{color:var(--sub);font-size:13.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef3f8;color:var(--navy2);margin:0 4px 4px 0}
.tag.red{background:#fbe9e6;color:var(--red)}
.tag.gold{background:#fdf1dc;color:#8a5a00}
.tag.green{background:#e4f4ea;color:var(--ok)}
.notice{border-left:4px solid var(--gold);background:#fffaf0;padding:10px 12px;border-radius:10px;font-size:13.5px;margin:10px 0}
.notice.red{border-color:var(--red);background:#fff4f2}
.jp{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}

/* timeline */
.day{margin-bottom:14px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:0 4px 8px}
.dayhead b{font-size:17px;white-space:nowrap}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ti{position:relative;margin-bottom:10px}
.ti::before{content:"";position:absolute;left:-20px;top:18px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--navy2)}
.ti.hl::before{border-color:var(--red)}
.ti .card{margin:0}
.ti .time{font-size:12.5px;font-weight:800;color:var(--navy2)}
.slot{border:2px dashed var(--line);background:transparent;box-shadow:none;color:var(--sub)}
textarea.memo,input.memo{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;background:#fffdf8;resize:vertical}

.plantabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.plantabs button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font:inherit;font-size:14px;font-weight:800;color:var(--sub);cursor:pointer}
.plantabs button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.tl.plan{display:none}.tl.plan.on{display:block}
.bform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bform select,.bform input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;background:#fffdf8}
.bform .full{grid-column:1/-1}
.bbtn{border:0;border-radius:12px;padding:11px;font:inherit;font-weight:800;background:var(--navy);color:#fff;cursor:pointer}
.bsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bsum div{background:#f6f3ec;border-radius:12px;padding:10px}
.bsum b{display:block;font-size:18px}
.bitem{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.bitem .del{border:0;background:none;color:var(--red);font-size:16px;cursor:pointer}
.bar{height:8px;border-radius:99px;background:var(--gold)}
/* steps */
.steps{counter-reset:s}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center}
.step .n.gold{background:var(--gold);color:#2a1a00}
.step p{margin:4px 0 0}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:700;
  padding:8px 12px;border-radius:12px;background:#eef3f8;color:var(--navy)}
.lbtn.yt{background:#fde8e6;color:#b3261e}
.lbtn.nv{background:#e5f6ea;color:#127a3a}
.lbtn.ts{background:#fff0e3;color:#a64b00}
.lbtn.map{background:var(--navy);color:#fff}

/* compare table */
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.cmp th{color:var(--sub);font-weight:600;width:24%}
table.cmp thead th{color:var(--navy);font-size:14px}

/* restaurant */
.rest .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rest .emoji{font-size:30px;line-height:1}
.price{font-weight:800;color:var(--red)}
.menu{margin:8px 0 0;padding:0;list-style:none}
.menu li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.menu li:last-child{border:0}

/* phrases */
.phr{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.phr .ko{font-size:13px;color:var(--sub)}
.phr .ja{font-size:17px;font-weight:700}
.phr .rd{font-size:12.5px;color:var(--navy2)}
.phr .zoom{flex:0 0 auto;font-size:20px;opacity:.6}

/* checklist */
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.chk input{width:22px;height:22px;accent-color:var(--ok);flex:0 0 auto;margin-top:1px}
.chk.done span{text-decoration:line-through;color:var(--sub)}

/* bottom dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b));width:calc(100% - 24px);max-width:536px;
  background:rgba(15,47,79,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:22px;display:grid;grid-template-columns:repeat(6,1fr);padding:6px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.dock button{background:none;border:0;color:#b8c7d6;font:inherit;font-size:10.5px;font-weight:700;padding:7px 0 5px;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.dock button .ic{font-size:21px;line-height:1}
.dock button.on{background:rgba(255,255,255,.12);color:#fff}

/* overlay (taxi card) */
.ov{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column;padding:calc(18px + var(--safe-t)) 18px calc(18px + var(--safe-b))}
.ov.show{display:flex}
.ov .close{align-self:flex-end;border:0;background:#eee;border-radius:99px;padding:10px 16px;font:inherit;font-weight:700;font-size:15px}
.ov .body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.ov .big{font-size:clamp(30px,9vw,46px);font-weight:900;line-height:1.3;color:#000}
.ov .addr{font-size:clamp(22px,6.5vw,30px);font-weight:800;line-height:1.45;color:#111}
.ov .ask{font-size:clamp(22px,6vw,28px);font-weight:700;color:var(--red)}
.ov .ko{font-size:14px;color:var(--sub)}
.ov .switch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ov .switch button{border:1px solid var(--line);background:#fafafa;border-radius:99px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700}
.ov .switch button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ov.rot .body{transform:rotate(90deg);transform-origin:center}

.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;
  background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{font-size:12px;color:var(--sub);text-align:center;margin:24px 0 8px}

</style></head><body>
<div class="app">
<header class="hero">
  <div class="row">
    <span style="display:flex;gap:6px"><a class="pill" href="../" style="color:#fff;text-decoration:none">← 내 여행</a><span class="pill dot" id="net">온라인</span></span>
    <span class="dday" id="dday"></span>
  </div>
  <h1 id="tTitle"></h1>
  <div class="meta" id="tMeta"></div>
  <div class="quick">
    <button class="qbtn primary" onclick="openCard()"><span class="ic">🚕</span>택시 카드</button>
    <button class="qbtn" onclick="copyAddr()"><span class="ic">📋</span>현지 주소 복사</button>
    <button class="qbtn" onclick="window.open(CONFIG.hotel.map,'_blank','noopener')"><span class="ic">🗺️</span>숙소 지도</button>
  </div>
</header>
<main>
<section class="page active" id="p-home">
  <h2 class="sec">🏨 숙소</h2><div class="card" id="hotelCard"></div>
  <div id="flightWrap"></div>
  <h2 class="sec">🗓️ 일정 <small>메모는 폰에 자동 저장</small></h2>
  <div id="days"></div>
</section>
<section class="page" id="p-move"><h2 class="sec">🚇 이동</h2><div id="moveList"></div></section>
<section class="page" id="p-food"><h2 class="sec">🍽️ 맛집</h2><div id="foodList"></div></section>
<section class="page" id="p-shop"><h2 class="sec">🛍️ 쇼핑</h2><div id="shopList"></div></section>
<section class="page" id="p-budget">
  <h2 class="sec">💴 예산 · 지출 기록 <small>이 기기에 저장</small></h2>
  <div class="card">
    <div class="bsum">
      <div><span class="muted">총 지출</span><b id="bTotJ">0</b><span class="muted" id="bTotK">₩0</span></div>
      <div><span class="muted" id="bPerLabel">1인당</span><b id="bPerJ">0</b><span class="muted" id="bPerK">₩0</span></div>
    </div>
    <div class="muted" style="margin-top:8px;font-size:13px">현금 <b id="bCash">0</b> · 카드 <b id="bCard">0</b></div>
    <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px">
      <span id="bRateLabel">환율 100 =</span>
      <input id="bRate" type="number" step="0.01" style="width:90px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit">
      <span>원</span>
      <button class="lbtn" style="border:0;font:inherit;font-size:12px;font-weight:700;padding:6px 10px" onclick="loadRate(true)">🔄 실시간 환율</button>
      <span class="muted" id="bRateInfo" style="font-size:11.5px"></span>
    </div>
  </div>
  <div class="card" id="bFormCard">
    <h3 id="bFormTitle">➕ 지출 추가</h3>
    <div class="bform">
      <select id="bDate"></select>
      <select id="bCat"><option>🍽️ 식비</option><option>🚇 교통</option><option>🛍️ 쇼핑</option><option>🎟️ 관광·입장</option><option>☕ 카페·간식</option><option>🏨 숙박</option><option>📦 기타</option></select>
      <input id="bMemo" class="full" placeholder="메모">
      <input id="bAmt" type="number" inputmode="decimal" placeholder="금액">
      <select id="bPay"><option>💳 카드</option><option>💴 현금</option></select>
      <button class="bbtn full" id="bSave" onclick="addExp()">추가하기</button>
      <button class="lbtn full" id="bCancel" style="display:none;border:0;font:inherit;font-size:13px;font-weight:700;justify-content:center" onclick="cancelEdit()">편집 취소</button>
    </div>
  </div>
  <div class="card"><h3>📊 카테고리별</h3><div id="bByCat" class="muted">아직 기록이 없어요</div></div>
  <div class="card"><h3>📅 날짜별</h3><div id="bByDate" class="muted">아직 기록이 없어요</div></div>
  <div class="card"><h3>🧾 전체 내역</h3><div id="bList" class="muted">아직 기록이 없어요</div>
    <div class="linkrow"><button class="lbtn" style="border:0;font:inherit;font-size:13px;font-weight:700" onclick="copyBudget()">📋 요약 복사 (카톡용)</button></div></div>
  <div class="card">
    <h3>📤 상세 내역 보내기</h3>
    <div class="linkrow">
      <button class="lbtn map" style="border:0;font:inherit;font-size:13px;font-weight:700" onclick="downloadCSV()">📄 엑셀(CSV) 저장</button>
      <button class="lbtn" style="border:0;font:inherit;font-size:13px;font-weight:700" onclick="shareCSV()">📤 파일 공유</button>
      <button class="lbtn" style="border:0;font:inherit;font-size:13px;font-weight:700" onclick="mailBudget()">✉️ 이메일</button>
    </div>
  </div>
  <div class="card">
    <h3>💻 폰 ↔ PC 기록 옮기기</h3>
    <p class="muted" style="font-size:13px;margin:4px 0 8px">폰에서 🔗 링크 만들기 → 카톡 '나에게 보내기' → PC에서 링크 열기 → 가져오기</p>
    <div class="linkrow">
      <button class="lbtn map" style="border:0;font:inherit;font-size:13px;font-weight:700" onclick="makeMoveLink()">🔗 옮기기 링크</button>
      <button class="lbtn" style="border:0;font:inherit;font-size:13px;font-weight:700" onclick="exportJSON()">💾 백업 저장</button>
      <button class="lbtn" id="bArchive" style="display:none;border:0;font:inherit;font-size:13px;font-weight:700" onclick="loadArchive()">📚 보관된 기록</button>
      <label class="lbtn" style="border:0;font:inherit;font-size:13px;font-weight:700;cursor:pointer">📂 백업 불러오기<input type="file" accept=".json,application/json" style="display:none" onchange="importJSONFile(this)"></label>
    </div>
  </div>
</section>
<section class="page" id="p-check">
  <h2 class="sec">✅ 체크리스트</h2><div class="card" id="checkList"></div>
  <h2 class="sec">🆘 비상 연락</h2><div class="card" id="sosList"></div>
  <div class="footer" id="foot"></div>
</section>
</main>
</div>
<nav class="dock" id="dock">
  <button class="on" data-p="home"><span class="ic">🏠</span>홈</button>
  <button data-p="move"><span class="ic">🚇</span>이동</button>
  <button data-p="food"><span class="ic">🍽️</span>맛집</button>
  <button data-p="shop"><span class="ic">🛍️</span>쇼핑</button>
  <button data-p="budget"><span class="ic">💴</span>예산</button>
  <button data-p="check"><span class="ic">✅</span>체크</button>
</nav>
<div class="ov" id="ov"><button class="close" onclick="closeCard()">✕ 닫기</button><div class="body" id="ovBody"></div><div class="switch" id="ovSwitch"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
 *  ✈️ 여행 설정 (CONFIG) — 새 여행은 여기만 고치면 됩니다
 *  - id: 폴더 이름과 같게 (영문·숫자·하이픈). 지출 기록 저장 이름으로도 쓰여요
 *  - 날짜는 YYYY-MM-DD, 지도는 구글맵 검색어(q)나 링크(map)
 *  - 아래 내용은 '예시'예요. 그대로 지우고 새 여행 내용으로 채우세요
 * ===================================================================== */
const CONFIG = {
  id: "example-trip",
  title: "예시 여행 ✈️",
  place: "일본 오사카",
  start: "2027-03-01",
  end: "2027-03-03",
  people: 4,
  lat: 34.69, lon: 135.50,              // 날씨용 위치 (도시 좌표)
  currency: "JPY", symbol: "¥", defaultRate: 950,   // 100 현지통화 = ?원 (실시간 실패 시 기본값)
  hotel: {
    name: "예시 호텔 (숙소 이름)",
    local: "サンプルホテル",              // 현지어 이름 (택시 카드에 크게 표시)
    address: "大阪府大阪市○○区○○1-2-3",   // 현지어 주소 (복사 버튼)
    map: "https://maps.google.com/?q=大阪",
    checkin: "15:00", checkout: "11:00",
    note: "역에서 도보 ○분"
  },
  flights: [   // 없으면 [] 로
    { team: "전원", go: "인천 09:00 → 간사이 10:40", back: "간사이 18:00 → 인천 19:50" }
  ],
  cards: [     // 택시/현지인에게 보여줄 카드 (첫 번째는 숙소)
    { label: "🏨 숙소로", big: "サンプルホテル", addr: "大阪府大阪市○○区<br>○○1-2-3", ask: "ここまで<br>お願いします。", ko: "이 호텔까지 부탁합니다" },
    { label: "✈️ 공항", big: "関西空港<br>第1ターミナル", addr: "", ask: "お願いします。", ko: "간사이공항 제1터미널까지" },
    { label: "💳 카드?", big: "カードで<br>払えますか？", addr: "", ask: "", ko: "카드 결제 되나요?" }
  ],
  days: [
    { date: "2027-03-01", label: "도착", items: [
      { time: "10:40", title: "✈️ 공항 도착", body: "입국 → ATM → 시내 이동", hl: true },
      { time: "15:00", title: "🏨 체크인", body: "짐 풀고 출발" },
      { time: "저녁", title: "🍽️ 저녁", body: "맛집 탭 참고", q: "道頓堀" }

const TRIP_ID = (window.TRIP_ID || "fukuoka-2026");

const CUR = (window.TRIP_CUR || "JPY");
function bRows(){
  const order=(window.DATE_ORDER||["사전","11/7","11/8","11/9"]);
  return [...store.get("exp",[])].sort((a,b)=>order.indexOf(a.d)-order.indexOf(b.d)||a.id-b.id);
}
function csvCell(v){v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCSV(){
  const rows=bRows();const tot=rows.reduce((a,x)=>a+x.a,0);
  const L=[["날짜","카테고리","메모","결제",`금액(${CUR})`,"금액(KRW)"]];
  rows.forEach(x=>L.push([x.d==="사전"?"출발 전":x.d,x.c.replace(/^\S+\s/,""),x.m||"",x.p.replace(/^\S+\s/,""),x.a,Math.round(krw(x.a))]));
  L.push([]);L.push(["합계","","","",tot,Math.round(krw(tot))]);
  L.push([`1인당(${PEOPLE}명)`,"","","",Math.round(tot/PEOPLE),Math.round(krw(tot/PEOPLE))]);
  const gc=group(rows,"c");L.push([]);L.push(["카테고리별 합계"]);
  Object.entries(gc).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>L.push([k.replace(/^\S+\s/,""),"","","",v,Math.round(krw(v))]));
  L.push([]);L.push([`환율: 100${CUR==="JPY"?"엔":CUR} = ${bRate.value}원`]);
  return "﻿"+L.map(r=>r.map(csvCell).join(",")).join("\r\n");
}
function dl(name,text,type){
  const blob=new Blob([text],{type});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function downloadCSV(){if(!bRows().length){toast("기록이 없어요");return}dl(`${TRIP_ID}-지출내역.csv`,buildCSV(),"text/csv;charset=utf-8");toast("CSV 저장 (엑셀로 열려요)")}
async function shareCSV(){
  if(!bRows().length){toast("기록이 없어요");return}
  const f=new File([buildCSV()],`${TRIP_ID}-지출내역.csv`,{type:"text/csv"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:`${TRIP_NAME} 지출 내역`});return}catch(e){if(e.name==="AbortError")return}}
  downloadCSV();
}

  const tot=rows.reduce((a,x)=>a+x.a,0);
  const lines=rows.map(x=>`${x.d==="사전"?"출발 전":x.d} | ${x.c.replace(/^\S+\s/,"")} | ${x.m||"-"} | ${x.p.replace(/^\S+\s/,"")} | ${fmtJ(x.a)} (${fmtK(krw(x.a))})`);
  const gc=group(rows,"c");
  const body=`[${TRIP_NAME} 지출 내역]\n총 ${fmtJ(tot)} (${fmtK(krw(tot))})\n1인당 ${fmtJ(tot/PEOPLE)} (${fmtK(krw(tot/PEOPLE))})\n\n■ 카테고리별\n`+Object.entries(gc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${fmtJ(v)} (${fmtK(krw(v))})`).join("\n")+`\n\n■ 상세 내역 (날짜 | 카테고리 | 메모 | 결제 | 금액)\n`+lines.join("\n")+`\n\n환율 100엔 = ${bRate.value}원`;
  location.href=`mailto:?subject=${encodeURIComponent(TRIP_NAME+" 지출 내역")}&body=${encodeURIComponent(body)}`;
}
function backupObj(){return {v:1,trip:TRIP_ID,name:TRIP_NAME,cur:CUR,people:PEOPLE,rate:parseFloat(bRate.value)||null,exp:store.get("exp",[]),at:new Date().toISOString()}}
function exportJSON(){dl(`${TRIP_ID}-budget-backup.json`,JSON.stringify(backupObj(),null,1),"application/json");toast("백업 파일 저장")}
function applyImport(obj){
  if(!obj||!Array.isArray(obj.exp)){toast("올바른 백업이 아니에요");return}
  if(obj.trip&&obj.trip!==TRIP_ID&&!confirm(`다른 여행(${obj.name||obj.trip})의 기록이에요. 그래도 가져올까요?`))return;
  const cur=store.get("exp",[]);
  let mode="merge";
  if(cur.length) mode=confirm(`가져올 기록 ${obj.exp.length}건\n\n[확인] 지금 기록과 합치기 (같은 항목은 최신으로)\n[취소] 지금 기록을 지우고 덮어쓰기`)?"merge":"replace";
  let out;
  if(mode==="replace"){if(!confirm("이 기기의 기록을 지우고 덮어쓸까요?"))return;out=obj.exp}
  else{const m=new Map(cur.map(x=>[x.id,x]));obj.exp.forEach(x=>m.set(x.id,x));out=[...m.values()]}
  store.set("exp",out);if(obj.rate){bRate.value=obj.rate;store.set("rate",{v:obj.rate,t:"가져온 값"})}
  renderBudget();toast(`${obj.exp.length}건 가져옴`);
}
function importJSONFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{applyImport(JSON.parse(r.result))}catch(e){toast("파일을 읽지 못했어요")}inp.value=""};r.readAsText(f);
}
const b64u={enc:u8=>btoa(String.fromCharCode(...u8)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""),
  dec:s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}};
async function packData(obj){
  const txt=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){const cs=new Blob([txt]).stream().pipeThrough(new CompressionStream("gzip"));return "z"+b64u.enc(new Uint8Array(await new Response(cs).arrayBuffer()))}
  return "p"+b64u.enc(txt);
}
async function unpackData(s){
  const kind=s[0],u8=b64u.dec(s.slice(1));
  if(kind==="z"){const ds=new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));return JSON.parse(await new Response(ds).text())}
  return JSON.parse(new TextDecoder().decode(u8));
}
async function makeMoveLink(){
  if(!bRows().length){toast("기록이 없어요");return}
  const url=location.origin+location.pathname+"#import="+await packData(backupObj());
  if(navigator.share){try{await navigator.share({title:`${TRIP_NAME} 지출 기록 옮기기`,text:"이 링크를 PC에서 열면 지출 기록이 들어가요",url});return}catch(e){if(e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(url);toast("링크 복사됨 · 카톡 나에게 보내기 → PC에서 열기")}catch(e){prompt("이 링크를 복사해 PC에서 여세요",url)}
}
async function checkImportHash(){
  const h=location.hash;if(!h.startsWith("#import="))return;
  try{const obj=await unpackData(h.slice(8));history.replaceState(null,"",location.pathname+"#budget");go("budget");
    if(confirm(`다른 기기의 지출 기록 ${obj.exp.length}건을 이 기기로 가져올까요?`))applyImport(obj);}
  catch(e){toast("링크가 잘못됐어요")}
}

async function loadArchive(){try{const r=await fetch("expenses.json",{cache:"no-store"});applyImport(await r.json())}catch(e){toast("보관된 기록이 없어요")}}
fetch("expenses.json",{cache:"no-store"}).then(r=>{if(r.ok)$("bArchive").style.display="inline-flex"}).catch(()=>{});
renderBudget();loadRate();
const h=location.hash.slice(1);if(["home","move","food","shop","budget","check"].includes(h))go(h);
checkImportHash();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
